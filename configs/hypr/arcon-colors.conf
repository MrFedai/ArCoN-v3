# ArCoN v3.0 fallback colour set for hyprlock.conf.
# v2.5 hyprlock.conf sourced ~/.config/Ax-Shell/config/hypr/colors.conf, which only
# exists when the (now archived) Ax-Shell theme is installed. ArCoN uses this file
# instead when Ax-Shell is absent so hyprlock does not start with undefined colours.
$primary = rgb(bd93f9)
$secondary = rgb(ff79c6)
$tertiary = rgb(8be9fd)
$foreground = rgb(f8f8f2)
$error = rgb(ff5555)
