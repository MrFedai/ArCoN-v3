# One table per logical package. Columns per distro; "" = not packaged there
# (Flatpak fallback applies when `flatpak` is set, D22). `ubuntu` defaults to `debian`.
# arch: "aur:NAME" = AUR (built with the AUR helper); a plain name is looked up in
#       the official repositories first (pacman -Si) and falls back to the AUR.
#
# Source: v3.0 reference branch catalog (D17). Verification status per column is
# recorded in docs/PACKAGE_CATALOG.md — run scripts/verify_catalog.py to refresh.

